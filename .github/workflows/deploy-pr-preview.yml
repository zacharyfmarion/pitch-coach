name: Deploy PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

concurrency:
  group: deploy-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    name: Deploy Cloudflare PR Preview
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.head.repo.fork }}
    env:
      VITE_DEMUCS_MODEL_URL: ${{ vars.VITE_DEMUCS_MODEL_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy preview to Cloudflare Pages
        run: npx wrangler@3 pages deploy dist --project-name=pitch-coach --branch=pr-${{ github.event.pull_request.number }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  comment:
    name: Publish Preview Comment
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Create or update sticky comment
        uses: actions/github-script@v7
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.pitch-coach.pages.dev
        with:
          script: |
            const marker = '<!-- codex-pr-preview -->';
            const issue_number = context.payload.pull_request.number;
            const deployed = process.env.DEPLOY_RESULT === 'success';
            const lines = [
              marker,
              '## PR Preview',
              '',
              deployed ? 'Status: deployed' : 'Status: skipped or failed',
              '',
              `Preview URL: ${process.env.PREVIEW_URL}`,
              `Commit: \`${context.payload.pull_request.head.sha}\``
            ];
            const body = lines.join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
